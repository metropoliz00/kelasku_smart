name: Build & Rilis Desktop Windows (.exe)

on:
  push:
    branches-ignore:
      - gh-pages
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: desktop-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repositori
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Aktifkan Windows Developer Mode (symlink support)
        shell: pwsh
        run: |
          try {
            Set-ItemProperty -Path "HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\AppModelUnlock" -Name "AllowDevelopmentWithoutDevLicense" -Value 1 -ErrorAction SilentlyContinue
          } catch {
            Write-Host "Skip Developer Mode registry update"
          }

      - name: Konfigurasi Git Identity
        shell: pwsh
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Install dependensi
        shell: pwsh
        run: |
          npm install --legacy-peer-deps --no-audit --no-fund

      - name: Cek tipe TypeScript
        run: npm run lint

      - name: Tetapkan versi rilis otomatis untuk pembaruan .exe
        shell: pwsh
        run: |
          $pkg = Get-Content package.json -Raw | ConvertFrom-Json
          $baseParts = ($pkg.version -split '\.')
          $major = if ($baseParts.Count -ge 1 -and $baseParts[0] -match '^\d+$') { $baseParts[0] } else { "1" }
          $minor = if ($baseParts.Count -ge 2 -and $baseParts[1] -match '^\d+$') { $baseParts[1] } else { "0" }
          if ($env:GITHUB_REF -like "refs/tags/v*") {
            $rawTag = $env:GITHUB_REF_NAME.TrimStart('v')
            $tagParts = ($rawTag -split '\.')
            if ($tagParts.Count -ge 3) {
              $nextVer = "$($tagParts[0]).$($tagParts[1]).$($tagParts[2])"
            } elseif ($tagParts.Count -eq 2) {
              $nextVer = "$($tagParts[0]).$($tagParts[1]).0"
            } else {
              $nextVer = "$major.$minor.$env:GITHUB_RUN_NUMBER"
            }
          } else {
            $nextVer = "$major.$minor.$env:GITHUB_RUN_NUMBER"
          }
          Write-Host "Membangun installer desktop versi: $nextVer"
          npm version $nextVer --no-git-tag-version --allow-same-version
          Add-Content -Path $env:GITHUB_ENV -Value "RELEASE_VERSION=$nextVer"

      - name: Build frontend & paket installer Windows (.exe)
        shell: pwsh
        env:
          VITE_GAS_WEB_APP_URL: ${{ vars.VITE_GAS_WEB_APP_URL }}
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: |
          npx vite build
          if (Test-Path "electron/icon.ico") {
            npx electron-builder --win --publish never -c.win.signExecutable=false -c.forceCodeSigning=false -c.npmRebuild=false
          } else {
            npx electron-builder --win --publish never -c.win.icon=electron/icon.png -c.win.signExecutable=false -c.forceCodeSigning=false -c.npmRebuild=false
          }

      - name: Tampilkan daftar file hasil build (.exe)
        shell: pwsh
        run: |
          Write-Host "File yang berhasil dibuat di folder release:"
          Get-ChildItem -Path release | Select-Object Name, Length

      - name: Unggah artefak build .exe (Download langsung dari Actions)
        uses: actions/upload-artifact@v4
        with:
          name: kelasku-smart-windows-${{ env.RELEASE_VERSION }}
          path: |
            release/*.exe
            release/*.yml
          if-no-files-found: warn

      - name: Publikasikan ke GitHub Releases secara otomatis
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        with:
          tag_name: v${{ env.RELEASE_VERSION }}
          name: KELASKU SMART v${{ env.RELEASE_VERSION }}
          files: |
            release/*.exe
            release/*.yml
          fail_on_unmatched_files: false
          draft: false
          prerelease: false
          generate_release_notes: true
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

name: Build & Rilis Desktop Windows (.exe)

on:
  push:
    branches-ignore:
      - gh-pages
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: desktop-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repositori
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependensi
        shell: pwsh
        run: |
          if (Test-Path package-lock.json) {
            npm ci --no-audit --no-fund
          } else {
            npm install --no-audit --no-fund
          }

      - name: Cek tipe TypeScript
        run: npm run lint

      - name: Tetapkan versi rilis otomatis untuk pembaruan .exe
        shell: pwsh
        run: |
          $pkg = Get-Content package.json -Raw | ConvertFrom-Json
          $baseParts = ($pkg.version -split '\.')
          $major = if ($baseParts.Count -ge 1) { $baseParts[0] } else { "1" }
          $minor = if ($baseParts.Count -ge 2) { $baseParts[1] } else { "0" }
          if ($env:GITHUB_REF -like "refs/tags/v*") {
            $nextVer = $env:GITHUB_REF_NAME.TrimStart('v')
          } else {
            $nextVer = "$major.$minor.$env:GITHUB_RUN_NUMBER"
          }
          Write-Host "Building desktop version: $nextVer"
          npm version $nextVer --no-git-tag-version --allow-same-version
          "RELEASE_VERSION=$nextVer" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build frontend & paket installer Windows (.exe)
        env:
          VITE_GAS_WEB_APP_URL: ${{ vars.VITE_GAS_WEB_APP_URL }}
        run: npm run desktop:build

      - name: Unggah artefak build .exe
        uses: actions/upload-artifact@v4
        with:
          name: kelasku-smart-windows-${{ env.RELEASE_VERSION }}
          path: |
            release/*.exe
            release/latest.yml
          if-no-files-found: error

      - name: Publikasikan ke GitHub Releases secara otomatis
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v*') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: v${{ env.RELEASE_VERSION }}
          name: KELASKU SMART v${{ env.RELEASE_VERSION }}
          files: |
            release/*.exe
            release/latest.yml
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
